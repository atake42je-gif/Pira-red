name: Generar APK de PiraRed

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Configurar e instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Crear iconos de PiraRed
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          set -euo pipefail
          logo="app/src/main/assets/www/app/Img/06-logo-pirared.png"
          test -f "$logo"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$logo" -auto-orient -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done
          mkdir -p app/src/main/res/drawable-nodpi
          convert "$logo" -auto-orient -resize "260x260" -background none -gravity center -extent "432x432" app/src/main/res/drawable-nodpi/pirared_logo_foreground.png

      - name: Preparar firma de version estable (si esta configurada)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pirared-release.jks"
            test -s "$RUNNER_TEMP/pirared-release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pirared-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "PIRARED_BUILD_TYPE=release"
            } >> "$GITHUB_ENV"
            echo "Firma release configurada."
          else
            echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "::warning::Se genera APK de prueba. Para actualizaciones compatibles se necesita configurar la firma privada estable en GitHub Secrets."
          fi

      - name: Verificar archivos de publicidad PiraRed
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/README.md
          test -s supabase/migrations/202610230001_pirared_commerce_ads.sql
          test -s supabase/migrations/20261023000100_pirared_payments.sql
          grep -q 'create table if not exists public.ads' supabase/migrations/202610230001_pirared_commerce_ads.sql
          test -s supabase/migrations/202610250001_pirared_community_posts.sql
          test -s supabase/migrations/202610250002_pirared_rls_performance_tuning.sql
          test -s supabase/migrations/202610250003_pirared_private_message_permissions.sql
          test -s supabase/migrations/202610250004_pirared_reports_and_blocks.sql
          test -s supabase/migrations/202610250005_pirared_reports_blocks_indexes.sql
          test -s supabase/migrations/202610250006_pirared_respect_user_blocks_in_messages.sql
          grep -q 'PIRARED_SUPABASE_URL' app/src/main/assets/www/index.html
          grep -q 'PIRARED_SUPABASE_KEY' app/src/main/assets/www/index.html
          echo "Archivos de publicidad, esquema y configuración cliente Supabase presentes."

      - name: Validar JavaScript de la interfaz
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', source, re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if len(inline) != 1:
              raise SystemExit(f"Se esperaba un script JavaScript inline, se encontraron {len(inline)}")
          Path("/tmp/pirared-inline.js").write_text(inline[0], encoding="utf-8")
          PY
          node --check /tmp/pirared-inline.js

      - name: Verificar adaptacion movil y privacidad del registro
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          checks = {
              "sin portada de carga duplicada": 'id="pirared-splash"' not in html,
              "zoom accesible": "maximum-scale=1" not in html and "user-scalable=no" not in html,
              "portada proporcional y adaptable": "img.naturalWidth" in html and "img.naturalHeight" in html and "object-fit:contain" in html,
              "zonas tactiles separadas": "welcome-actions button:nth-child(3)" in html,
              "pantallas independientes": "s.hidden = !isCurrent" in html,
              "no recolecta DNI sin verificacion segura": "authDni" not in html and "dni_number" not in html,
              "no solicita selfie sin almacenamiento seguro": "authSelfie" not in html and "pendingProfileSelfie" not in html,
              "pantalla de inicio de sesión independiente": 'id="login"' in html,
              "pantalla de registro independiente": 'id="register"' in html,
              "acceso de comercios independiente": 'id="commerce"' in html,
              "mensajes privados conectados": "/rest/v1/private_messages" in html,
              "publicaciones conectadas": "/rest/v1/community_posts" in html,
              "promociones aprobadas conectadas": "/rest/v1/ads" in html and "loadPublicAds();" in html,
              "registro conectado a Supabase Auth": "/auth/v1/signup" in html,
              "sin campo de teléfono público en el alta": 'name="public_contact"' not in html,
              "clave pública, sin clave de servicio": "sb_publishable_" in html and "service_role" not in html,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("OK: " if passed else "ERROR: ") + name)
          if failed:
              raise SystemExit("Fallaron validaciones de interfaz: " + ", ".join(failed))
          PY

      - name: Verificar inicio no bloqueante y orientacion adaptable
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'setCancelable(true)' app/src/main/java/ar/pirared/app/MainActivity.java
          grep -q 'Ahora no' app/src/main/java/ar/pirared/app/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/ar/pirared/app/MainActivity.java").read_text()
          start = source.index('.setPositiveButton("Ver actualización"')
          end = source.index('.show();', start)
          if "finish()" in source[start:end]:
              raise SystemExit("El aviso de actualización no debe cerrar la aplicación.")
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          if "screenOrientation=" in manifest:
              raise SystemExit("La aplicación no debe forzar una orientación.")
          print("OK: la actualización no cierra la app y la orientación queda adaptable.")
          PY
          echo "OK: actualización opcional y orientación Android adaptable."

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PIRARED_BUILD_TYPE:-debug}" = "release" ]; then
            gradle assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            gradle assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          echo "PIRARED_APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verificar APK, nombre e imagenes originales
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "app/src/main/assets/www/app/Img/01-inicio-pirared.png"
            "app/src/main/assets/www/app/Img/02-monumento-plaza.jpg"
            "app/src/main/assets/www/app/Img/03-plaza-juegos.jpg"
            "app/src/main/assets/www/app/Img/04-informacion-pirared.jpg"
            "app/src/main/assets/www/app/Img/05-yo-amo-pirane.jpg"
            "app/src/main/assets/www/app/Img/06-logo-pirared.png"
            "app/src/main/assets/www/app/Img/07-vista-aerea-pirane.jpg"
            "app/src/main/assets/www/app/Img/08-monumento-50-anios.jpg"
          )
          for image in "${images[@]}"; do
            test -s "$image" || { echo "Falta la imagen original: $image"; exit 1; }
          done
          APK="$PIRARED_APK_PATH"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          grep -F "package: name='ar.pirared.app'" <<< "$BADGING"
          grep -F "application-label:'PiraRed'" <<< "$BADGING"
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/res/drawable-nodpi/pirared_logo_foreground.png
          grep -q '@drawable/pirared_logo_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/pirared_logo_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote
          html = Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          refs = sorted(set(unquote(ref) for ref in re.findall(r'''(?:src|href)=["'](app/Img/[^"'#?]+)''', html)))
          missing = [ref for ref in refs if not (Path("app/src/main/assets/www") / ref).is_file()]
          if missing:
              raise SystemExit("Referencias de imagen inexistentes en index.html: " + ", ".join(missing))
          print(f"Verificadas {len(refs)} referencias locales a imágenes usadas por la interfaz.")
          PY
          echo "Verificados paquete Android, nombre PiraRed, icono, imágenes principales y referencias locales."

      - name: Preparar APK con nombre final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PIRARED_APK_PATH" dist/PiraRed.apk
          test -s dist/PiraRed.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v5
        with:
          name: PiraRed-APK
          path: dist/PiraRed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK descargable directamente (sin ZIP)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="prueba-${GITHUB_RUN_NUMBER}"
          if [ "${PIRARED_BUILD_TYPE:-debug}" = "release" ]; then
            NOTES="APK de PiraRed firmada con la clave estable configurada. Se puede actualizar una instalación con la misma firma."
            gh release create "$TAG" dist/PiraRed.apk --title "PiraRed ${TAG}" --notes "$NOTES" --latest
          else
            NOTES="APK de prueba de PiraRed. Se descarga directamente como archivo .apk, no como ZIP. Al ser una compilación debug, puede requerir desinstalar la versión anterior antes de instalar; desinstalar puede borrar datos locales."
            gh release create "$TAG" dist/PiraRed.apk --title "PiraRed ${TAG} (prueba)" --notes "$NOTES" --prerelease
          fi
