<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<title>PiraRed</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  color: white;
  background: #101820;
  min-height: 100vh;
}

.app {
  max-width: 600px;
  min-height: 100vh;
  margin: auto;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.30),
      rgba(0,0,0,.78)
    ),
    url("https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1000&q=85")
    center / cover fixed;
}

header {
  padding: 28px 22px;
  text-align: center;
}

.logo {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 0 3px 15px #000;
}

.logo span {
  color: #54d6ff;
}

.slogan {
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: 1px;
}

main {
  padding: 15px 20px 35px;
}

.bienvenida {
  margin: 35px 0 28px;
  text-align: center;
}

.bienvenida h1 {
  font-size: 27px;
  text-shadow: 0 2px 10px #000;
}

.bienvenida p {
  margin-top: 10px;
  color: #eee;
  line-height: 1.5;
}

.opciones {
  display: grid;
  gap: 16px;
}

.boton {
  width: 100%;
  padding: 22px 18px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,.45);
  background: rgba(255,255,255,.12);
  color: white;
  text-align: left;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  transition: .2s;
}

.boton:active {
  transform: scale(.98);
  background: rgba(84,214,255,.25);
}

.boton strong {
  display: block;
  font-size: 20px;
  margin-bottom: 7px;
}

.boton small {
  font-size: 13px;
  color: #eee;
}

.icono {
  float: right;
  font-size: 29px;
}

.pie {
  text-align: center;
  padding: 22px;
  font-size: 12px;
  color: #ddd;
}

.pantalla {
  display: none;
  padding: 20px;
}

.pantalla h2 {
  margin-bottom: 20px;
}

.volver {
  margin-bottom: 25px;
  padding: 10px 16px;
  border: 1px solid white;
  border-radius: 12px;
  background: #ffffff18;
  color: white;
  font-size: 15px;
}

input, textarea, select {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #ffffff66;
  background: #101820cc;
  color: white;
}

.publicacion {
  padding: 17px;
  margin: 12px 0;
  border-radius: 15px;
  background: #ffffff18;
  border: 1px solid #ffffff55;
}

.publicacion h3 {
  margin-bottom: 8px;
}

.precio {
  color: #75e3ff;
  font-weight: bold;
  margin-top: 10px;
}

.accion {
  width: 100%;
  border: 1px solid #8de8ff;
  border-radius: 12px;
  padding: 14px;
  color: white;
  background: #087bea99;
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">Pira<span>Red</span></div>
  <div class="slogan">Pirané capital provincial del folklore</div>
</header>

<main id="inicio">

  <div class="bienvenida">
    <h1>Todo cerca de vos</h1>
    <p>Comprá, vendé y encontrá oportunidades<br>
    en Pirané y localidades cercanas.</p>
  </div>

  <div class="opciones">

    <button class="boton" onclick="abrir('mercado')">
      <span class="icono">🛍️</span>
      <strong>Compra / Venta</strong>
      <small>Productos, vehículos, terrenos y mucho más.</small>
    </button>

    <button class="boton" onclick="abrir('trabajos')">
      <span class="icono">🔨</span>
      <strong>Trabajos y Changas</strong>
      <small>Encontrá trabajo u ofrecé tus servicios.</small>
    </button>

    <button class="boton" onclick="abrir('crear')">
      <span class="icono">➕</span>
      <strong>Crear publicación</strong>
      <small>Publicá un producto o servicio.</small>
    </button>

    <button class="boton" onclick="abrir('cuenta')">
      <span class="icono">👤</span>
      <strong>Mi cuenta</strong>
      <small>Tu perfil y tus publicaciones.</small>
    </button>

  </div>

</main>

<section class="pantalla" id="mercado">
  <button class="volver" onclick="inicio()">← Volver</button>
  <h2>🛍️ Compra / Venta</h2>
  <input id="buscarMercado" placeholder="Buscar publicaciones..."
    oninput="mostrar('mercado')">
  <div id="listaMercado"></div>
</section>

<section class="pantalla" id="trabajos">
  <button class="volver" onclick="inicio()">← Volver</button>
  <h2>🔨 Trabajos y Changas</h2>
  <input id="buscarTrabajos" placeholder="Buscar trabajos..."
    oninput="mostrar('trabajos')">
  <div id="listaTrabajos"></div>
</section>

<section class="pantalla" id="crear">
  <button class="volver" onclick="inicio()">← Volver</button>
  <h2>➕ Crear publicación</h2>

  <form id="formulario">
    <input id="titulo" placeholder="Título de la publicación" required>

    <select id="tipo">
      <option value="mercado">Compra / Venta</option>
      <option value="trabajos">Trabajos y Changas</option>
    </select>

    <textarea id="descripcion" placeholder="Descripción" required></textarea>

    <input id="precio" type="number" min="0"
      placeholder="Precio en pesos (0 si es un servicio gratuito)" required>

    <input id="foto" type="file" accept="image/*">

    <button class="accion" type="submit">Publicar</button>
  </form>
</section>

<section class="pantalla" id="cuenta">
  <button class="volver" onclick="inicio()">← Volver</button>
  <h2>👤 Mi cuenta</h2>

  <form id="perfil">
    <input id="nombre" placeholder="Tu nombre" required>
    <input id="telefono" placeholder="Tu teléfono">
    <textarea id="bio" placeholder="Contanos algo sobre vos"></textarea>
    <button class="accion" type="submit">Guardar perfil</button>
  </form>

  <p id="estadoPerfil" style="margin-top:15px"></p>
</section>

<div class="pie">
  PiraRed · Pirané, Formosa, Argentina
</div>

</div>

<script>
const clave = "pirared_publicaciones_v1";
const perfilClave = "pirared_perfil_v1";

let publicaciones = JSON.parse(localStorage.getItem(clave) || "[]");

function guardar() {
  localStorage.setItem(clave, JSON.stringify(publicaciones));
}

function abrir(id) {
  document.getElementById("inicio").style.display = "none";

  document.querySelectorAll(".pantalla").forEach(p => {
    p.style.display = "none";
  });

  document.getElementById(id).style.display = "block";

  if (id === "mercado" || id === "trabajos") {
    mostrar(id);
  }
}

function inicio() {
  document.querySelectorAll(".pantalla").forEach(p => {
    p.style.display = "none";
  });

  document.getElementById("inicio").style.display = "block";
}

function escapar(texto) {
  return String(texto).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function mostrar(tipo) {
  const campo = document.getElementById(
    tipo === "mercado" ? "buscarMercado" : "buscarTrabajos"
  );

  const lista = document.getElementById(
    tipo === "mercado" ? "listaMercado" : "listaTrabajos"
  );

  const busqueda = (campo.value || "").toLowerCase();

  const resultados = publicaciones.filter(p =>
    p.tipo === tipo &&
    (p.titulo + " " + p.descripcion).toLowerCase().includes(busqueda)
  );

  lista.innerHTML = resultados.length
    ? resultados.map(p => `
      <article class="publicacion">
        <h3>${escapar(p.titulo)}</h3>
        ${p.foto ? `<img src="${p.foto}" alt=""
          style="width:100%;border-radius:10px;margin:10px 0">` : ""}
        <p>${escapar(p.descripcion)}</p>
        <p class="precio">$${Number(p.precio).toLocaleString("es-AR")}</p>
      </article>
    `).join("")
    : "<p>Todavía no hay publicaciones. ¡Podés crear la primera!</p>";
}

document.getElementById("formulario").addEventListener("submit", async e => {
  e.preventDefault();

  const archivo = document.getElementById("foto").files[0];
  let foto = "";

  if (archivo) {
    if (archivo.size > 700000) {
      alert("Elegí una foto de menos de 700 KB para evitar problemas de almacenamiento.");
      return;
    }

    foto = await new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => resolve(lector.result);
      lector.onerror = reject;
      lector.readAsDataURL(archivo);
    });
  }

  publicaciones.unshift({
    titulo: document.getElementById("titulo").value.trim(),
    tipo: document.getElementById("tipo").value,
    descripcion: document.getElementById("descripcion").value.trim(),
    precio: document.getElementById("precio").value,
    foto
  });

  try {
    guardar();
  } catch (error) {
    publicaciones.shift();
    alert("No se pudo guardar. Probá con una foto más pequeña.");
    return;
  }

  e.target.reset();
  alert("¡Publicación guardada en este dispositivo!");
  inicio();
});

document.getElementById("perfil").addEventListener("submit", e => {
  e.preventDefault();

  const datos = {
    nombre: document.getElementById("nombre").value,
    telefono: document.getElementById("telefono").value,
    bio: document.getElementById("bio").value
  };

  localStorage.setItem(perfilClave, JSON.stringify(datos));

  document.getElementById("estadoPerfil").textContent =
    "¡Perfil guardado correctamente!";
});

try {
  const datos = JSON.parse(localStorage.getItem(perfilClave) || "null");

  if (datos) {
    document.getElementById("nombre").value = datos.nombre || "";
    document.getElementById("telefono").value = datos.telefono || "";
    document.getElementById("bio").value = datos.bio || "";
  }
} catch (error) {
  console.log("No se pudo cargar el perfil.");
}
</script>

</body>
</html>
