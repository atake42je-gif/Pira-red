name: Crear APK PiraRed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar carpetas y recursos
        run: |
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/java/ar/pirared/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/www/index.html
          cp MainActivity.java app/src/main/java/ar/pirared/app/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          for f in ./*.jpg ./*.jpeg ./*.png; do
            [ -f "$f" ] || continue
            cp "$f" app/src/main/assets/www/
          done

          mkdir -p app/src/main/assets/www/img
          for f in ./*.jpg ./*.jpeg ./*.png; do
            [ -f "$f" ] || continue
            cp "$f" app/src/main/assets/www/img/
          done

          if [ -f "logo-pirared.png" ]; then
            cp logo-pirared.png app/src/main/res/drawable/pirared_logo.png
            cp logo-pirared.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp logo-pirared.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp logo-pirared.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp logo-pirared.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp logo-pirared.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Crear configuración Gradle
        run: |
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'PiraRed'; include ':app'" > settings.gradle

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          echo "plugins { id 'com.android.application' }; android { namespace 'ar.pirared.app'; compileSdk 35; defaultConfig { applicationId 'ar.pirared.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }" > app/build.gradle

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
