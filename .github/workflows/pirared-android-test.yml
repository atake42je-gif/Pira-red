name: Generar APK de prueba PiraRed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar firma persistente si está configurada
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pirared-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pirared-release.jks" >> "$GITHUB_ENV"
            echo "PIRARED_BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Se usará la firma de lanzamiento configurada en los secretos."
          else
            echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "No hay todos los secretos de firma; se generará APK debug para instalación de prueba."
          fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$PIRARED_BUILD_TYPE" = "release" ]; then
            gradle --no-daemon clean assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            gradle --no-daemon clean assembleDebug
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK_PATH"
          echo "PIRARED_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-APK-prueba
          path: ${{ env.PIRARED_APK_PATH }}
          if-no-files-found: error
          retention-days: 14
