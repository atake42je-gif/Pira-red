name: Crear APK PiraRed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

       - name: Instalar paquetes Android
  shell: bash
  run: |
    set -euxo pipefail
    export ANDROID_SDK_ROOT="${ANDROID_HOME}"
    export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"

    if [ ! -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
      echo "cmdline-tools/latest no existe; instalando..."
      mkdir -p "${ANDROID_HOME}/cmdline-tools"
      yes | sdkmanager --install "cmdline-tools;latest"
    fi

    yes | sdkmanager --licenses
    sdkmanager --install \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0"

      - name: Preparar archivos
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/assets/www/img
          mkdir -p app/src/main/java/ar/pirared/app

          cp index.html app/src/main/assets/www/index.html
          cp MainActivity.java app/src/main/java/ar/pirared/app/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          for f in ./*.jpg ./*.jpeg ./*.png; do
            [ -f "$f" ] || continue
            cp "$f" app/src/main/assets/www/
            cp "$f" app/src/main/assets/www/img/
          done

      - name: Crear configuración Gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PiraRed'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ar.pirared.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'ar.pirared.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
