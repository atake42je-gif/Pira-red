name: Generar APK de PiraRed

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Configurar e instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Crear iconos de PiraRed
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          set -euo pipefail
          logo="app/src/main/assets/www/app/Img/06-logo-pirared.png"
          test -f "$logo"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$logo" -auto-orient -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done
          mkdir -p app/src/main/res/drawable-nodpi
          convert "$logo" -auto-orient -resize "260x260" -background none -gravity center -extent "432x432" app/src/main/res/drawable-nodpi/pirared_logo_foreground.png

      - name: Preparar firma de version estable (si esta configurada)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pirared-release.jks"
            test -s "$RUNNER_TEMP/pirared-release.jks"

            if ! keytool -list -storepass "$KEYSTORE_PASSWORD" -keystore "$RUNNER_TEMP/pirared-release.jks" -alias "$KEY_ALIAS" >/tmp/pirared-keytool.log 2>&1; then
              echo "::warning::La firma de release configurada en GitHub Secrets es inválida o la contraseña no coincide. Se compilará en modo debug para no bloquear la pipeline."
              echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASSWORD=" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_PASSWORD=" >> "$GITHUB_ENV"
              exit 0
            fi

            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pirared-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "PIRARED_BUILD_TYPE=release"
            } >> "$GITHUB_ENV"
            echo "Firma release configurada y validada."
          else
            echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "::warning::Se genera APK de prueba. Para actualizaciones compatibles se necesita configurar la firma privada estable en GitHub Secrets."
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PIRARED_BUILD_TYPE:-debug}" = "release" ] && [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            gradle assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
            echo "Compilando APK con firma release validada."
          else
            echo "::warning::La configuración de firma release no es válida o no existe; compilando APK debug para asegurar que el pipeline siga funcionando."
            gradle assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          echo "PIRARED_APK_PATH=$APK" >> "$GITHUB_ENV"
