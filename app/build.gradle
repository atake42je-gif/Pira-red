plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def buildNumber = System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 3

android {
    namespace 'ar.pirared.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.pirared.app'
        minSdk 23
        targetSdk 35
        versionCode buildNumber
        versionName "1.2.${buildNumber}"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}
