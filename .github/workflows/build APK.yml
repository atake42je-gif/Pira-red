name: Generar APK de PiraRed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /opt/hostedtoolcache/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
            rm -rf /tmp/android-cmdline-tools
            mkdir -p /tmp/android-cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools
            mv /tmp/android-cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Crear iconos de PiraRed
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          logo="app/src/main/assets/www/app/Img/06-logo-pirared.png"
          test -s "$logo"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$logo" -auto-orient -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done
          mkdir -p app/src/main/res/drawable-nodpi
          convert "$logo" -auto-orient -resize "260x260" -background none -gravity center -extent "432x432" app/src/main/res/drawable-nodpi/pirared_logo_foreground.png

      - name: Preparar y validar firma estable
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::warning::Faltan secretos de firma. Se compilará una APK debug para que el workflow no falle."
            echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            exit 0
          fi

          ANDROID_KEY_ALIAS="pirared-release"
          KEYSTORE="$RUNNER_TEMP/pirared-release.jks"
          echo "Validación 1/3: decodificando el almacén."
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 no contiene Base64 válido."
            exit 1
          fi
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::El archivo de firma decodificado está vacío."
            exit 1
          fi

          echo "Validación 2/3: comprobando almacén, contraseña y alias."
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::No se pudo abrir el almacén: revisá ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y que el Base64 sea del JKS original."
            exit 1
          fi

          echo "Validación 3/3: comprobando la contraseña de la clave privada."
          mkdir -p "$RUNNER_TEMP/signing-check"
          printf 'PiraRed signing check\n' > "$RUNNER_TEMP/signing-check/check.txt"
          jar --create --file "$RUNNER_TEMP/signing-check.jar" -C "$RUNNER_TEMP/signing-check" .
          if ! jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -signedjar "$RUNNER_TEMP/signing-check-signed.jar" "$RUNNER_TEMP/signing-check.jar" "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::El almacén y alias son válidos, pero ANDROID_KEY_PASSWORD no abre la clave privada."
            exit 1
          fi
          echo "Firma privada validada correctamente."

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "PIRARED_BUILD_TYPE=release" >> "$GITHUB_ENV"
          echo "Firma validada correctamente: almacén, alias y clave privada."

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: pirared-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          if [ "${PIRARED_BUILD_TYPE:-debug}" = "release" ]; then
            ./gradlew --no-daemon clean assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            test -s "$APK_PATH"
            apksigner verify --verbose --print-certs "$APK_PATH"
            echo "PIRARED_ARTIFACT_NAME=PiraRed-APK-release" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon clean assembleDebug
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK_PATH"
            echo "PIRARED_ARTIFACT_NAME=PiraRed-APK-debug" >> "$GITHUB_ENV"
          fi

          echo "PIRARED_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PIRARED_ARTIFACT_NAME }}
          path: ${{ env.PIRARED_APK_PATH }}
          if-no-files-found: error
          retention-days: 30
