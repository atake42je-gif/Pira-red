name: Generar APK de prueba PiraRed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK con cmdline-tools
        shell: bash
        env:
          ANDROID_SDK_ROOT: /opt/hostedtoolcache/android-sdk
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT"
            mv "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools-old" 2>/dev/null || true
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools-old/bin" "$ANDROID_SDK_ROOT/cmdline-tools/bin"
            rmdir "$ANDROID_SDK_ROOT/cmdline-tools-old" 2>/dev/null || true
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Crear iconos de PiraRed
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          logo="app/src/main/assets/www/app/Img/06-logo-pirared.png"
          test -s "$logo"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$logo" -auto-orient -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done
          mkdir -p app/src/main/res/drawable-nodpi
          convert "$logo" -auto-orient -resize "260x260" -background none -gravity center -extent "432x432" app/src/main/res/drawable-nodpi/pirared_logo_foreground.png

      - name: Preparar firma persistente si está configurada
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pirared-release.jks"
            test -s "$RUNNER_TEMP/pirared-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pirared-release.jks" >> "$GITHUB_ENV"
            echo "PIRARED_BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Se usará la firma de lanzamiento configurada en los secretos."
          else
            echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "No hay todos los secretos de firma; se generará APK debug para instalación de prueba."
          fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          if [ "$PIRARED_BUILD_TYPE" = "release" ]; then
            ./gradlew --no-daemon clean assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew --no-daemon clean assembleDebug
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$APK_PATH"
          echo "PIRARED_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-APK-prueba
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
