name: Generar APK de prueba PiraRed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK sin paquete obsoleto tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Crear iconos de PiraRed
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          logo="app/src/main/assets/www/app/Img/06-logo-pirared.png"
          test -s "$logo"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$logo" -auto-orient -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done
          mkdir -p app/src/main/res/drawable-nodpi
          convert "$logo" -auto-orient -resize "260x260" -background none -gravity center -extent "432x432" app/src/main/res/drawable-nodpi/pirared_logo_foreground.png

      - name: Preparar compilación de prueba
        run: |
          echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
          echo "Esta tarea manual siempre genera una APK DEBUG de prueba."

      - name: Compilar APK
        env:
        run: |
          set -euo pipefail
          if [ "$PIRARED_BUILD_TYPE" = "release" ]; then
            ./gradlew --no-daemon clean assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK_PATH"
          echo "PIRARED_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-APK-prueba
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
