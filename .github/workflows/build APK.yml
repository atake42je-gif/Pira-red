name: Generar APK de PiraRed

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar herramientas Android
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear iconos de PiraRed
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          set -euo pipefail
          logo="app/src/main/assets/www/app/Img/06-logo-pirared.png"
          test -f "$logo"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$logo" -auto-orient -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done

      - name: Preparar firma de version estable (si esta configurada)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pirared-release.jks"
            test -s "$RUNNER_TEMP/pirared-release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pirared-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "PIRARED_BUILD_TYPE=release"
            } >> "$GITHUB_ENV"
            echo "Firma release configurada."
          else
            echo "PIRARED_BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "::warning::Se genera APK de prueba. Para actualizaciones compatibles se necesita configurar la firma privada estable en GitHub Secrets."
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PIRARED_BUILD_TYPE:-debug}" = "release" ]; then
            gradle assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            gradle assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          echo "PIRARED_APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verificar APK, nombre e imagenes originales
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            app/src/main/assets/www/app/Img/01-inicio-tren.jpg \
            app/src/main/assets/www/app/Img/02-monumento-plaza.jpg \
            app/src/main/assets/www/app/Img/03-plaza-juegos.jpg \
            app/src/main/assets/www/app/Img/04-informacion-pirared.jpg \
            app/src/main/assets/www/app/Img/05-yo-amo-pirane.jpg \
            app/src/main/assets/www/app/Img/06-logo-pirared.png; do
            test -s "$image" || { echo "Falta la imagen original: $image"; exit 1; }
          done
          APK="$PIRARED_APK_PATH"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          grep -F "package: name='ar.pirared.app'" <<< "$BADGING"
          grep -F "application-label:'PiraRed'" <<< "$BADGING"
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Verificados paquete Android, nombre PiraRed, icono y seis imagenes originales."

      - name: Preparar APK con nombre final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PIRARED_APK_PATH" dist/PiraRed.apk
          test -s dist/PiraRed.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-APK
          path: dist/PiraRed.apk
          if-no-files-found: error
          retention-days: 14
