<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07559b">
<title>PiraRed | Pirané</title>

<style>
:root {
  --azul:#0759a5;
  --celeste:#28baff;
  --vidrio:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#123b65;
  background:#dceeff;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(4,43,82,.30),rgba(4,35,67,.58)),
    url("https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1000&q=85")
    center/cover fixed;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px;
  color:white;
}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:#51c6ff}
.iconbtn{
  background:transparent;border:0;color:white;font-size:27px;
}
.screen{padding:0 15px 100px}
.search{
  display:flex;gap:8px;background:rgba(255,255,255,.93);
  padding:5px 13px;border-radius:40px;margin:10px 0 20px;
  box-shadow:0 5px 18px #001b3a33;
}
.search input{
  border:0;background:transparent;outline:none;
  width:100%;padding:12px 5px;color:#183e63;
}
.search button{border:0;background:none;font-size:23px}
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;margin:18px 0 25px;
}
.tile{
  min-height:112px;border:1px solid #ffffffbd;
  background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
  border-radius:20px;color:#0759a5;font-weight:700;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:9px 3px;
  box-shadow:0 4px 10px #001d3b24;
}
.tile .emoji{font-size:31px}
h2{font-size:19px;color:white;margin:22px 0 12px}
.sectionhead{display:flex;justify-content:space-between;align-items:center}
.linkbtn{border:0;background:transparent;color:white}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{
  background:rgba(255,255,255,.91);border-radius:17px;
  overflow:hidden;box-shadow:0 4px 15px #001d3b30;
}
.card img{width:100%;height:130px;object-fit:cover;display:block}
.cardbody{padding:10px}
.price{font-size:18px;color:#0759a5;font-weight:900}
.title{font-weight:700;margin:6px 0}
.small{font-size:13px;color:#58718b;margin-top:5px}
.heart{float:right;border:0;background:none;font-size:23px;color:#0759a5}
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(5,44,78,.84);backdrop-filter:blur(12px);
  border-top:1px solid #ffffff70;padding:10px 4px max(10px,env(safe-area-inset-bottom));
  z-index:5;
}
.nav button{border:0;background:transparent;color:white;font-size:12px}
.nav b{display:block;font-size:24px;margin-bottom:3px}
.panel{
  background:rgba(255,255,255,.87);backdrop-filter:blur(12px);
  padding:18px;border-radius:20px;margin:15px 0;
}
.field{width:100%;padding:13px;border:1px solid #b9d2e7;
  border-radius:12px;margin:7px 0 13px;background:white;color:#123b65}
.primary{
  background:linear-gradient(135deg,#0874ce,#22baff);color:white;
  border:0;border-radius:13px;padding:14px 18px;font-weight:bold;width:100%;
}
.secondary{
  background:#ffffffd9;border:1px solid #aacbe8;color:#0759a5;
  border-radius:12px;padding:10px;
}
.back{color:white;background:transparent;border:0;font-size:16px;padding:10px 0}
.empty{background:#ffffffdf;border-radius:16px;padding:22px;text-align:center}
.profilehead{text-align:center;color:white;padding:24px 0}
.avatar{font-size:70px}
.hidden{display:none!important}
.notice{font-size:12px;color:#54718d}
footer{text-align:center;color:white;font-size:12px;padding:20px}
</style>
</head>

<body>
<div id="app">
<header>
  <button class="iconbtn" onclick="menu()">☰</button>
  <div class="logo">📍Pira<span>Red</span></div>
  <button class="iconbtn" onclick="alert('¡Bienvenido a PiraRed!')">♧</button>
</header>

<main id="main" class="screen"></main>

<nav class="nav">
  <button onclick="home()"><b>⌂</b>Inicio</button>
  <button onclick="publish()"><b>⊕</b>Publicar</button>
  <button onclick="favorites()"><b>♡</b>Favoritos</button>
  <button onclick="profile()"><b>♙</b>Perfil</button>
</nav>
</div>

<script>
const $=s=>document.querySelector(s);
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

let posts=get('pirared_posts',[
 {id:1,title:'Yamaha XTZ 125',price:'450000',category:'Vehículos',location:'Pirané',desc:'Moto en venta. Consultar detalles.',img:'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=700&q=80'},
 {id:2,title:'Volkswagen Gol 2010',price:'3200000',category:'Vehículos',location:'Pirané',desc:'Vehículo en venta. Consultar detalles.',img:'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=700&q=80'},
 {id:3,title:'Casa en Pirané',price:'Consultar',category:'Inmuebles',location:'Pirané',desc:'Consulta por esta propiedad.',img:'https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=700&q=80'},
 {id:4,title:'Jardinero',price:'Consultar',category:'Trabajos y Changas',location:'Pirané',desc:'Mantenimiento de jardines y patios.',img:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=700&q=80'}
]);
let favs=get('pirared_favs',[]);
let user=get('pirared_user',{name:'',phone:'',bio:''});
let current='Inicio',query='',category='Todos';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return v&&v!=='Consultar'?'$ '+Number(v).toLocaleString('es-AR'):'Consultar precio'}
function tile(icon,label,fn){return `<button class="tile" onclick="${fn}"><span class="emoji">${icon}</span><span>${label}</span></button>`}
function searchbox(){return `<div class="search"><input id="q" placeholder="Buscar en PiraRed..." value="${esc(query)}" oninput="searchChanged(this.value)"><button onclick="filters()">⌕</button></div>`}
function card(p){
return `<article class="card">
<img src="${esc(p.img)}" alt="${esc(p.title)}" onerror="this.style.display='none'">
<div class="cardbody">
<button class="heart" onclick="toggleFav(${p.id})">${favs.includes(p.id)?'♥':'♡'}</button>
<div class="price">${esc(money(p.price))}</div>
<div class="title">${esc(p.title)}</div>
<div class="small">📍 ${esc(p.location||'Pirané')}</div>
<button class="secondary" style="width:100%;margin-top:9px" onclick="detail(${p.id})">Ver publicación</button>
</div></article>`
}
function cards(list){return list.length?`<div class="cards">${list.map(card).join('')}</div>`:`<div class="empty">Todavía no hay publicaciones para mostrar.</div>`}
function heading(title,action=''){return `<div class="sectionhead"><h2>${title}</h2>${action}</div>`}
function home(){
current='Inicio';
let m=$('#main');
m.innerHTML=`
${searchbox()}
<div class="grid">
${tile('🛒','Compra / Venta',"openCategory('Compra / Venta')")}
${tile('💼','Trabajos y Changas',"openCategory('Trabajos y Changas')")}
${tile('🚘','Vehículos',"openCategory('Vehículos')")}
${tile('⌂','Inmuebles',"openCategory('Inmuebles')")}
${tile('⚙️','Servicios',"openCategory('Servicios')")}
${tile('👥','Comunidad',"openCategory('Comunidad')")}
</div>
${heading('Publicaciones destacadas',`<button class="linkbtn" onclick="allPosts()">Ver todas ›</button>`)}
${cards(posts.slice(0,4))}
<footer>PiraRed · Pirané, Formosa<br>Todo cerca. Todo conectado.</footer>`;
}
function searchChanged(v){query=v}
function allPosts(){current='Publicaciones';renderList(posts,'Todas las publicaciones')}
function openCategory(c){category=c;renderList(posts.filter(p=>c==='Compra / Venta'?['Compra / Venta','Vehículos','Inmuebles','Electrónica','Hogar','Ropa'].includes(p.category):p.category===c),c)}
function renderList(list,title){
current=title;
const filtered=list.filter(p=>(!query||(p.title+' '+p.desc+' '+p.category).toLowerCase().includes(query.toLowerCase())));
$('#main').innerHTML=`<button class="back" onclick="home()">‹ Volver al inicio</button><h2>${esc(title)}</h2>${searchbox()}${cards(filtered)}`
}
function filters(){
current='Filtros';
$('#main').innerHTML=`<button class="back" onclick="home()">‹ Volver</button><h2>Filtros de búsqueda</h2><div class="panel"><label>Categoría</label><select id="cat" class="field">
${['Todos','Compra / Venta','Trabajos y Changas','Vehículos','Inmuebles','Servicios','Comunidad','Electrónica','Hogar','Ropa'].map(c=>`<option>${c}</option>`).join('')}
</select><label>Buscar</label><input id="fq" class="field" placeholder="¿Qué estás buscando?"><button class="primary" onclick="query=$('#fq').value;openCategory($('#cat').value)">Aplicar filtros</button></div>`;
}
function publish(){
current='Publicar';
$('#main').innerHTML=`<button class="back" onclick="home()">‹ Volver</button><h2>Crear publicación</h2>
<div class="panel"><label>Título</label><input id="pt" class="field" placeholder="Ej.: Vendo moto">
<label>Categoría</label><select id="pc" class="field">${['Compra / Venta','Trabajos y Changas','Vehículos','Inmuebles','Servicios','Comunidad','Electrónica','Hogar','Ropa'].map(c=>`<option>${c}</option>`).join('')}</select>
<label>Precio (en pesos, o escribir Consultar)</label><input id="pp" class="field" placeholder="Ej.: 450000">
<label>Ubicación</label><input id="pl" class="field" value="Pirané">
<label>Descripción</label><textarea id="pd" class="field" rows="4" placeholder="Contá los detalles de tu publicación"></textarea>
<label>Enlace de foto (opcional)</label><input id="pi" class="field" placeholder="https://...">
<p class="notice">Esta versión guarda las publicaciones en este dispositivo.</p>
<button class="primary" onclick="createPost()">Publicar</button></div>`;
}
function createPost(){
let title=$('#pt').value.trim();
if(!title){alert('Escribí un título para la publicación.');return}
let price=$('#pp').value.trim()||'Consultar';
let raw=Number(price.replace(/[.$ ]/g,''));
if(price.toLowerCase()!=='consultar'&&(!Number.isFinite(raw)||raw<0)){alert('Ingresá un precio válido o escribí Consultar.');return}
posts.unshift({id:Date.now(),title,price:price.toLowerCase()==='consultar'?'Consultar':String(raw),category:$('#pc').value,location:$('#pl').value.trim()||'Pirané',desc:$('#pd').value.trim(),img:$('#pi').value.trim()});
save('pirared_posts',posts);alert('¡Publicación guardada!');home();
}
function detail(id){
let p=posts.find(x=>x.id===id);if(!p)return;
current='Detalle';
$('#main').innerHTML=`<button class="back" onclick="home()">‹ Volver</button><div class="panel">${p.img?`<img src="${esc(p.img)}" style="width:100%;border-radius:14px" onerror="this.style.display='none'">`:''}<h2 style="color:#0759a5">${esc(p.title)}</h2><div class="price">${esc(money(p.price))}</div><p>📍 ${esc(p.location)}</p><p>${esc(p.desc)}</p><p class="small">Categoría: ${esc(p.category)}</p><button class="primary" onclick="toggleFav(${p.id});detail(${p.id})">${favs.includes(p.id)?'♥ Quitar de favoritos':'♡ Agregar a favoritos'}</button></div>`;
}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save('pirared_favs',favs);if(current==='Favoritos')favorites();else if(current==='Inicio')home()}
function favorites(){current='Favoritos';$('#main').innerHTML=`<h2>♡ Mis favoritos</h2>${cards(posts.filter(p=>favs.includes(p.id)))}`}
function profile(){
current='Perfil';
$('#main').innerHTML=`<div class="profilehead"><div class="avatar">👤</div><h2>Mi perfil</h2></div><div class="panel"><label>Nombre</label><input id="un" class="field" value="${esc(user.name)}" placeholder="Tu nombre"><label>Teléfono</label><input id="up" class="field" value="${esc(user.phone)}" placeholder="Tu teléfono"><label>Sobre mí</label><textarea id="ub" class="field" rows="3" placeholder="Contá algo sobre vos">${esc(user.bio)}</textarea><button class="primary" onclick="saveProfile()">Guardar perfil</button><p class="notice">Los datos quedan guardados en este dispositivo.</p></div>`;
}
function saveProfile(){user={name:$('#un').value.trim(),phone:$('#up').value.trim(),bio:$('#ub').value.trim()};save('pirared_user',user);alert('Perfil guardado.');profile()}
function menu(){
$('#main').innerHTML=`<h2>Menú PiraRed</h2><div class="panel">${['Inicio','Compra / Venta','Trabajos y Changas','Vehículos','Inmuebles','Servicios','Comunidad','Publicar','Favoritos','Perfil'].map(x=>`<button class="secondary" style="width:100%;margin:4px 0" onclick="${x==='Inicio'?'home()':x==='Publicar'?'publish()':x==='Favoritos'?'favorites()':x==='Perfil'?'profile()':`openCategory('${x}')`}">${x}</button>`).join('')}</div>`;
}
home();
</script>
</body>
</html>
